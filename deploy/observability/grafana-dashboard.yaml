# Grafana loads any ConfigMap labelled grafana_dashboard=1 (sidecar).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-vigneshwara-web
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  vigneshwara-web.json: |
    {
      "title": "Vigneshwara Web - Service Health",
      "uid": "vigneshwara-web",
      "schemaVersion": 39,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "tags": [
        "vigneshwara"
      ],
      "panels": [
        {
          "title": "Running version",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "max by (version) (app_build_info{namespace=\"vigneshwara\"})",
              "legendFormat": "{{version}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "options": {
            "textMode": "name",
            "colorMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "title": "Availability (non-5xx, 1h)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "1 - vigneshwara:errors5xx:ratio_rate1h",
              "legendFormat": "",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.995
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "p95 latency (5m)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "vigneshwara:latency:p95_5m",
              "legendFormat": "",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "title": "Ready pods",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"vigneshwara\",deployment=\"vigneshwara-web\"}",
              "legendFormat": "",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "title": "Requests under 1s (30m)",
          "type": "stat",
          "description": "Latency SLO: at least 95% of requests in under 1 second.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "vigneshwara:latency:fast_ratio_rate30m",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.95
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "title": "Error budget left (3d window)",
          "type": "stat",
          "description": "Share of the 0.5% error budget not used yet. The SLO is defined over 30 days; locally Prometheus keeps 3 days, so this uses the last 3 days.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 4,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "1 - ((sum(increase(nginx_ingress_controller_requests{exported_namespace=\"vigneshwara\",ingress=\"vigneshwara-web\",status=~\"5..\"}[3d])) or vector(0)) / clamp_min(sum(increase(nginx_ingress_controller_requests{exported_namespace=\"vigneshwara\",ingress=\"vigneshwara-web\"}[3d])), 1)) / 0.005",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "title": "Supabase query errors (1h)",
          "type": "stat",
          "description": "Failed catalogue queries. Pages still return 200 with no products, so this is the only signal.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "sum(increase(app_dependency_request_duration_seconds_count{namespace=\"vigneshwara\",dependency=\"supabase\",outcome=\"error\"}[1h])) or vector(0)",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "title": "Owner emails failed (24h)",
          "type": "stat",
          "description": "Inquiry notification emails that Brevo did not accept. The inquiry itself is still saved.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 4,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "expr": "sum(increase(app_notifications_total{namespace=\"vigneshwara\",channel=\"email\",result=\"failed\"}[24h])) or vector(0)",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "title": "Requests per second by status",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(nginx_ingress_controller_requests{exported_namespace=\"vigneshwara\",ingress=\"vigneshwara-web\"}[5m]))",
              "legendFormat": "{{status}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "title": "5xx error ratio vs SLO budget (0.5%)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "expr": "vigneshwara:errors5xx:ratio_rate5m",
              "legendFormat": "5xx ratio (5m)",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "0.005",
              "legendFormat": "SLO limit",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          }
        },
        {
          "title": "Latency percentiles (ingress)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (le) (rate(nginx_ingress_controller_request_duration_seconds_bucket{exported_namespace=\"vigneshwara\",ingress=\"vigneshwara-web\"}[5m])))",
              "legendFormat": "p50",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(nginx_ingress_controller_request_duration_seconds_bucket{exported_namespace=\"vigneshwara\",ingress=\"vigneshwara-web\"}[5m])))",
              "legendFormat": "p95",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(nginx_ingress_controller_request_duration_seconds_bucket{exported_namespace=\"vigneshwara\",ingress=\"vigneshwara-web\"}[5m])))",
              "legendFormat": "p99",
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "title": "Customer inquiries by result",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 15,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "expr": "sum by (result) (increase(app_inquiries_total{namespace=\"vigneshwara\"}[15m]))",
              "legendFormat": "{{result}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "title": "Supabase query latency p95 by outcome",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, outcome) (rate(app_dependency_request_duration_seconds_bucket{namespace=\"vigneshwara\",dependency=\"supabase\"}[10m])))",
              "legendFormat": "{{outcome}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "title": "Pod restarts (15m)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 22,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"vigneshwara\",container=\"web\"}[15m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ]
        },
        {
          "title": "CPU per pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 29,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"vigneshwara\",pod=~\"vigneshwara-web-[a-z0-9]+-[a-z0-9]+\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          }
        },
        {
          "title": "Memory per pod (limit 512Mi)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 29,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"vigneshwara\",pod=~\"vigneshwara-web-[a-z0-9]+-[a-z0-9]+\"})",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "title": "Error logs",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 36,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "expr": "{namespace=\"vigneshwara\", app=\"vigneshwara-web\", level=~\"error|warn\"}",
              "legendFormat": "",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "description": "Structured warn/error lines from the app. Empty means no errors in the selected time range."
        }
      ]
    }
