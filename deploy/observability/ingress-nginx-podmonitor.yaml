# Scrape the ingress controller: it sees every user request, so it is the
# source for request rate, 5xx ratio and latency (the SLO metrics).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ingress-nginx
  namespace: monitoring
  labels: { release: kube-prometheus-stack }
spec:
  namespaceSelector:
    matchNames: [ingress-nginx]
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
  podMetricsEndpoints:
    # minikube's ingress addon serves metrics on 10254 but does not declare
    # that port on the pod, so select the declared http port and point the
    # scrape address at 10254 instead.
    - port: http
      path: /metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_ip]
          targetLabel: __address__
          replacement: "$1:10254"
